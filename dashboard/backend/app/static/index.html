<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>theta-lab dashboard</title>
<style>
  :root { color-scheme: light dark; }
  body { font-family: -apple-system, Segoe UI, sans-serif; margin: 0; padding: 24px; background: #f7f7f8; color: #1a1a1a; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .subtitle { color: #666; font-size: 13px; margin-bottom: 20px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; margin-bottom: 24px; }
  .card { background: #fff; border: 1px solid #e2e2e2; border-radius: 8px; padding: 16px; }
  .card h2 { font-size: 14px; margin: 0 0 12px; text-transform: uppercase; letter-spacing: 0.04em; color: #444; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid #eee; }
  th { color: #666; font-weight: 500; }
  .num { text-align: right; font-variant-numeric: tabular-nums; }
  .status-open { color: #b45309; }
  .status-blocked { color: #b91c1c; }
  .status-resolved, .status-cleared { color: #15803d; }
  .empty { color: #999; font-size: 13px; }
  .refresh-btn { font-size: 12px; padding: 4px 10px; border: 1px solid #ccc; border-radius: 6px; background: #fff; cursor: pointer; }
</style>
</head>
<body>
  <h1>theta-lab dashboard</h1>
  <div class="subtitle" id="as-of">Loading...</div>
  <button class="refresh-btn" id="refresh-btn">Refresh live data</button>

  <div class="grid" style="margin-top: 20px;">
    <div class="card">
      <h2>YTD realized ($1.2M objective)</h2>
      <div id="ytd-summary"><p class="empty">Loading...</p></div>
    </div>
    <div class="card">
      <h2>Account status</h2>
      <div id="account-status"><p class="empty">Loading...</p></div>
    </div>
  </div>

  <div class="card">
    <h2>Active decisions</h2>
    <div id="active-decisions"><p class="empty">Loading...</p></div>
  </div>

  <script>
    function fmt(n) {
      if (n === null || n === undefined) return "-";
      return "$" + Number(n).toLocaleString(undefined, { maximumFractionDigits: 0 });
    }

    async function loadYtd() {
      const resp = await fetch("api/ytd");
      const data = await resp.json();
      document.getElementById("as-of").textContent = "As of " + data.as_of;
      const rows = Object.entries(data.per_account).map(([label, v]) => `
        <tr>
          <td>${label}</td>
          <td class="num">${fmt(v.ytd_realized)}</td>
          <td class="num">${fmt(v.mtd_realized)}</td>
          <td class="num">${fmt(v.annual_target)}</td>
        </tr>`).join("");
      document.getElementById("ytd-summary").innerHTML = `
        <table>
          <thead><tr><th>Account</th><th class="num">YTD</th><th class="num">MTD</th><th class="num">Target</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
        <p style="margin-top:10px; font-size:13px;">
          Portfolio YTD: <strong>${fmt(data.portfolio_ytd_realized)}</strong>
          / ${fmt(data.objective_annual)} objective
        </p>`;
    }

    async function loadAccountStatus() {
      const resp = await fetch("api/account-status");
      const rows = await resp.json();
      const body = rows.map(r => `
        <tr>
          <td>${r.account}</td>
          <td>${r.account_type ?? ""}</td>
          <td class="num">${fmt(r.balance)}</td>
          <td>${r.status ?? ""}</td>
        </tr>`).join("");
      document.getElementById("account-status").innerHTML = `
        <table>
          <thead><tr><th>Account</th><th>Type</th><th class="num">Balance</th><th>Status</th></tr></thead>
          <tbody>${body}</tbody>
        </table>`;
    }

    async function loadActiveDecisions() {
      const resp = await fetch("api/active-decisions");
      const items = await resp.json();
      if (!items.length) {
        document.getElementById("active-decisions").innerHTML = '<p class="empty">No tracked decisions.</p>';
        return;
      }
      const rows = items.map(d => {
        const statusClass = "status-" + (d.status || "").toLowerCase();
        const desc = (d.description || "").split("\n")[0].slice(0, 140);
        return `<tr>
          <td>${d.id}</td>
          <td class="${statusClass}">${d.status || ""}</td>
          <td>${d.account || ""}</td>
          <td>${desc}${desc.length === 140 ? "..." : ""}</td>
        </tr>`;
      }).join("");
      document.getElementById("active-decisions").innerHTML = `
        <table>
          <thead><tr><th>ID</th><th>Status</th><th>Account</th><th>Summary</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>`;
    }

    async function loadAll() {
      await Promise.all([loadYtd(), loadAccountStatus(), loadActiveDecisions()]);
    }

    document.getElementById("refresh-btn").addEventListener("click", async () => {
      await fetch("api/refresh", { method: "POST" });
      await loadAll();
    });

    loadAll();
  </script>
</body>
</html>
