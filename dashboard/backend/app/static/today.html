<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>theta-lab — Today</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@uswds/uswds@3.14.0/dist/css/uswds.min.css">
<style>
  body { margin: 0; background: #f0f0f0; }
  .topbar {
    background: #2e2e38; color: #fff; padding: 12px 24px; display: flex;
    align-items: center; justify-content: space-between;
  }
  .topbar a { color: #fff; }
  .topbar .crumbs a { color: #d3d3db; text-decoration: none; font-size: 13px; margin-left: 12px; }
  main { max-width: 820px; margin: 0 auto; padding: 24px 16px 64px; }

  .state-card {
    background: #fff; border: 1px solid #dfe1e2; border-radius: 4px; padding: 16px 20px;
    margin-bottom: 20px; display: flex; gap: 32px; flex-wrap: wrap; align-items: center;
  }
  .state-card .stat { min-width: 110px; }
  .state-card .stat .label { font-size: 11px; text-transform: uppercase; color: #71767a; }
  .state-card .stat .value { font-size: 20px; font-weight: 700; color: #1b1b1b; }
  .state-card .stale { color: #b50909; font-size: 12px; margin-left: auto; }
  .state-form { margin-left: auto; display: flex; gap: 6px; flex-wrap: wrap; }
  .state-form input { width: 100px; padding: 4px 6px; font-size: 13px; }

  .context-notes { margin-bottom: 20px; }
  .context-notes .note {
    background: #fef0c8; border-left: 4px solid #c3762a; padding: 8px 14px;
    font-size: 13.5px; margin-bottom: 6px; border-radius: 2px;
  }

  .section-head {
    font-size: 13px; text-transform: uppercase; font-weight: 700; color: #565c65;
    margin: 24px 0 8px; letter-spacing: .04em;
  }
  .section-head.relief { color: #936316; }
  .section-head.gate { color: #b50909; }

  .item { background: #fff; border: 1px solid #dfe1e2; border-left: 4px solid #a9aeb1;
          border-radius: 3px; padding: 12px 16px; margin-bottom: 8px; }
  .item.relief { border-left-color: #c3762a; }
  .item.gate { border-left-color: #b50909; }
  .item.manage { border-left-color: #565c65; }
  .item.entry { border-left-color: #1a7a1a; }
  .item .action { font-weight: 700; font-size: 14.5px; margin-bottom: 4px; }
  .item .why { font-size: 13px; color: #3d4551; }
  .item .detail { font-size: 12.5px; color: #71767a; margin-top: 4px; }

  .empty { color: #757575; font-style: italic; padding: 24px; text-align: center; }
</style>
</head>
<body>
<div class="topbar">
  <strong>theta-lab — Today</strong>
  <span class="crumbs"><a href="/">&larr; both dashboards</a><a href="us">US</a><a href="composite-scores">Composite Scores</a><a href="watchlist">Watchlist</a></span>
</div>
<main>
  <div class="state-card" id="state-card">Loading account state...</div>
  <div class="context-notes" id="context-notes"></div>
  <div id="plan-container"><p class="empty">Loading...</p></div>
</main>
<script>
const SECTION_CLASS = {
  "GATE": "gate", "CASH RELIEF FIRST": "relief",
  "MANAGE HARD STOPS": "manage", "NEW ENTRY CANDIDATES": "entry",
};

async function loadState() {
  const r = await fetch("api/us/account-state?account=A");
  const s = await r.json();
  renderState(s);
  return s;
}

function renderState(s) {
  const card = document.getElementById("state-card");
  if (!s) {
    card.innerHTML = `<span>No account state on file yet.</span>` + stateForm({});
    return;
  }
  const fmt = (v) => v == null ? "—" : "$" + Number(v).toLocaleString();
  card.innerHTML = `
    <div class="stat"><div class="label">Cash</div><div class="value">${fmt(s.cash)}</div></div>
    <div class="stat"><div class="label">Cash + Borrowing</div><div class="value">${fmt(s.cash_plus_borrowing)}</div></div>
    <div class="stat"><div class="label">Option Req.</div><div class="value">${fmt(s.option_requirement)}</div></div>
    <div class="stat"><div class="label">Equity %</div><div class="value">${s.equity_pct == null ? "—" : s.equity_pct + "%"}</div></div>
    ${s.days_stale > 0 ? `<div class="stale">${s.days_stale}d old</div>` : ""}
  ` + stateForm(s);
}

function stateForm(s) {
  return `
    <form class="state-form" id="state-form">
      <input name="cash" placeholder="Cash" type="number" value="${s.cash ?? ''}">
      <input name="cash_plus_borrowing" placeholder="Cash+Borrow" type="number" value="${s.cash_plus_borrowing ?? ''}">
      <input name="option_requirement" placeholder="Opt. Req." type="number" value="${s.option_requirement ?? ''}">
      <input name="equity_pct" placeholder="Equity %" type="number" step="0.1" value="${s.equity_pct ?? ''}">
      <button class="usa-button usa-button--outline" type="submit" style="margin:0;">Update</button>
    </form>`;
}

document.addEventListener("submit", async (e) => {
  if (e.target.id !== "state-form") return;
  e.preventDefault();
  const fd = new FormData(e.target);
  const body = { account: "A" };
  for (const [k, v] of fd.entries()) if (v !== "") body[k] = parseFloat(v);
  await fetch("api/us/account-state", { method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body) });
  loadPlan();
});

async function loadPlan() {
  const r = await fetch("api/us/today");
  const data = await r.json();
  renderState(data.account_state);

  const notesEl = document.getElementById("context-notes");
  notesEl.innerHTML = (data.context_notes || []).map(n => `<div class="note">${n}</div>`).join("");

  const container = document.getElementById("plan-container");
  if (!data.plan || !data.plan.length) {
    container.innerHTML = `<p class="empty">Nothing actionable right now.</p>`;
    return;
  }
  let html = "";
  let lastSection = null;
  for (const item of data.plan) {
    if (item.section !== lastSection) {
      html += `<div class="section-head ${SECTION_CLASS[item.section] || ''}">${item.section}</div>`;
      lastSection = item.section;
    }
    html += `
      <div class="item ${SECTION_CLASS[item.section] || ''}">
        <div class="action">${item.action}</div>
        <div class="why">${item.why}</div>
        ${item.detail ? `<div class="detail">${item.detail}</div>` : ""}
      </div>`;
  }
  container.innerHTML = html;
}

loadPlan();
</script>
</body>
</html>
