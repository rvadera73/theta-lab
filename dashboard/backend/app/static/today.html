<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>theta-lab — Today</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@uswds/uswds@3.14.0/dist/css/uswds.min.css">
<style>
  /* Minimal overrides only -- everything else below is real USWDS markup
     (usa-accordion, usa-alert, usa-tag, usa-table, usa-form), per the
     2026-10-16 fix: the first version of this page used ad-hoc custom CSS
     that ignored the design system the rest of the dashboard is built on,
     AND relied on color alone (border-left colors) to convey severity --
     a WCAG failure (color must never be the only way information is
     conveyed) on top of the inconsistency. usa-accordion also solves the
     "clutter on a long page" complaint directly: panels are collapsed by
     default, keyboard/screen-reader accessible out of the box via USWDS's
     own JS (aria-expanded/hidden managed for us, not hand-rolled). */
  body { margin: 0; background: #f0f0f0; }
  .topbar {
    background: #2e2e38; color: #fff; padding: 12px 24px; display: flex;
    align-items: center; justify-content: space-between;
  }
  .topbar a { color: #fff; }
  .topbar .crumbs a { color: #d3d3db; text-decoration: none; font-size: 13px; margin-left: 12px; }
  main { max-width: 820px; margin: 0 auto; padding: 24px 16px 64px; }
  .state-card { background: #fff; border: 1px solid #dfe1e2; border-radius: 4px; padding: 16px 20px; margin-bottom: 1rem; }
  .state-stats { display: flex; gap: 32px; flex-wrap: wrap; margin-bottom: 12px; }
  .state-stats .stat .usa-tag { margin-bottom: 4px; }
  .state-stats .stat .value { font-size: 20px; font-weight: 700; color: #1b1b1b; }
  .section-head { margin: 1.5rem 0 .5rem; }
  .leg-reason-row td { font-size: 13px; color: #3d4551; padding-top: 0; }
  .empty { color: #757575; font-style: italic; padding: 24px; text-align: center; }
</style>
</head>
<body>
<div class="topbar">
  <strong>theta-lab — Today</strong>
  <span class="crumbs"><a href="/">&larr; both dashboards</a><a href="us">US</a><a href="composite-scores">Composite Scores</a><a href="watchlist">Watchlist</a></span>
</div>
<main>
  <section class="state-card" aria-labelledby="state-heading">
    <h2 id="state-heading" class="usa-prose" style="margin-top:0;">Account A — current state</h2>
    <div id="state-stats" class="state-stats">Loading…</div>
    <form class="usa-form" id="state-form">
      <div class="grid-row grid-gap-sm">
        <div class="tablet:grid-col-3">
          <label class="usa-label" for="f-cash">Cash</label>
          <input class="usa-input" id="f-cash" name="cash" type="number" step="0.01">
        </div>
        <div class="tablet:grid-col-3">
          <label class="usa-label" for="f-cpb">Cash + borrowing</label>
          <input class="usa-input" id="f-cpb" name="cash_plus_borrowing" type="number" step="0.01">
        </div>
        <div class="tablet:grid-col-3">
          <label class="usa-label" for="f-oreq">Option requirement</label>
          <input class="usa-input" id="f-oreq" name="option_requirement" type="number" step="0.01">
        </div>
        <div class="tablet:grid-col-2">
          <label class="usa-label" for="f-eq">Equity %</label>
          <input class="usa-input" id="f-eq" name="equity_pct" type="number" step="0.1">
        </div>
        <div class="tablet:grid-col-1" style="display:flex; align-items:flex-end;">
          <button class="usa-button" type="submit">Update</button>
        </div>
      </div>
    </form>
  </section>

  <div id="context-notes"></div>
  <div id="plan-container"><p class="empty">Loading…</p></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@uswds/uswds@3.14.0/dist/js/uswds.min.js"></script>
<script>
// Section -> USWDS tag color class (text label always present alongside
// color, never color-only -- see the top-of-file note on WCAG).
const SECTION_TAG = {
  "GATE": "bg-secondary-dark",
  "CASH RELIEF FIRST": "bg-gold",
  "MANAGE HARD STOPS": "bg-base-dark",
  "NEW ENTRY CANDIDATES": "bg-green",
};
const COLOR_TAG = { RED: "bg-secondary-dark", YELLOW: "bg-gold", GREEN: "bg-green", UNKNOWN: "bg-base-dark" };

function fmtUsd(v) { return v == null ? "—" : "$" + Number(v).toLocaleString(); }

function renderState(s) {
  const el = document.getElementById("state-stats");
  const form = document.getElementById("state-form");
  if (!s) {
    el.innerHTML = `<span>No account state on file yet — enter it below.</span>`;
    return;
  }
  el.innerHTML = `
    <div class="stat"><span class="usa-tag bg-base-light text-ink">Cash</span><div class="value">${fmtUsd(s.cash)}</div></div>
    <div class="stat"><span class="usa-tag bg-base-light text-ink">Cash + borrowing</span><div class="value">${fmtUsd(s.cash_plus_borrowing)}</div></div>
    <div class="stat"><span class="usa-tag bg-base-light text-ink">Option requirement</span><div class="value">${fmtUsd(s.option_requirement)}</div></div>
    <div class="stat"><span class="usa-tag bg-base-light text-ink">Equity %</span><div class="value">${s.equity_pct == null ? "—" : s.equity_pct + "%"}</div></div>
    ${s.days_stale > 0 ? `<span class="usa-tag bg-secondary-dark">${s.days_stale}d old — re-check</span>` : ""}
  `;
  form.cash.value = s.cash ?? "";
  form.cash_plus_borrowing.value = s.cash_plus_borrowing ?? "";
  form.option_requirement.value = s.option_requirement ?? "";
  form.equity_pct.value = s.equity_pct ?? "";
}

document.getElementById("state-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const fd = new FormData(e.target);
  const body = { account: "A" };
  for (const [k, v] of fd.entries()) if (v !== "") body[k] = parseFloat(v);
  await fetch("api/us/account-state", { method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body) });
  loadPlan();
});

function renderLegDetail(ref) {
  if (ref && Array.isArray(ref.legs)) {
    const rows = ref.legs.map((lg, i) => `
      <tr>
        <td><span class="usa-tag ${COLOR_TAG[lg.color] || 'bg-base-dark'}">${lg.color || '-'}</span></td>
        <td>${lg.type || '-'} $${lg.strike ?? '-'}</td>
        <td>${lg.expiry || '-'} (${lg.dte ?? '-'}d)</td>
        <td>${lg.action || '-'}</td>
        <td>${lg.covered === true ? 'covered' : lg.covered === false ? (lg.strangle ? 'naked (strangle-paired)' : 'naked') : (lg.type === 'PUT' ? 'cash-secured' : '-')}</td>
      </tr>
      <tr class="leg-reason-row"><td colspan="5">${lg.reason || ''}</td></tr>
    `).join("");
    return `
      <table class="usa-table usa-table--borderless usa-table--compact" style="width:100%;">
        <caption class="usa-sr-only">All legs for ${ref.symbol}, account ${ref.account}</caption>
        <thead><tr><th scope="col">Color</th><th scope="col">Leg</th><th scope="col">Expiry</th><th scope="col">Action</th><th scope="col">Coverage</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
      <p class="usa-prose" style="font-size:13px; color:#3d4551;">Sector: ${ref.sector || '-'} · Total cost-to-close: ${fmtUsd(ref.total_cost_to_close)} · ${ref.leg_count} leg(s) total</p>`;
  }
  if (ref) {
    return `<p class="usa-prose" style="font-size:13px;">
      score=${ref.score ?? '-'} (rank ${ref.rank ?? '-'}/${ref.population_size ?? '-'}) ·
      yield=${ref.yield_pct ?? '-'}% · conviction=${ref.conviction ?? '-'} ·
      iv_rank=${ref.iv_rank ?? '-'} · real put/call yield=${ref.real_put_yield_pct ?? '-'}%/${ref.real_call_yield_pct ?? '-'}% ·
      beta=${ref.beta ?? '-'} · sector=${ref.sector ?? '-'}
      ${ref.gates_fired && ref.gates_fired.length ? `<br><span class="usa-tag bg-secondary-dark">Gates: ${ref.gates_fired.join(", ")}</span>` : ""}
    </p>`;
  }
  return "";
}

function renderPlanHtml(plan) {
  const container = document.getElementById("plan-container");
  if (!plan.length) {
    container.innerHTML = `<p class="empty">Nothing actionable right now.</p>`;
    return;
  }
  let html = "";
  let lastSection = null;
  let openSections = [];
  plan.forEach((item, idx) => {
    if (item.section !== lastSection) {
      html += `<h3 class="section-head"><span class="usa-tag ${SECTION_TAG[item.section] || 'bg-base-dark'}">${item.section}</span></h3>`;
      html += `<div class="usa-accordion usa-accordion--bordered" data-allow-multiple>`;
      lastSection = item.section;
    }
    const headingId = `h-${idx}`, contentId = `c-${idx}`;
    html += `
      <h4 class="usa-accordion__heading">
        <button type="button" class="usa-accordion__button" aria-expanded="false" aria-controls="${contentId}" id="${headingId}">
          ${item.action}
        </button>
      </h4>
      <div id="${contentId}" class="usa-accordion__content usa-prose" hidden aria-labelledby="${headingId}">
        <p>${item.why}</p>
        ${item.detail ? `<p style="font-size:13px; color:#71767a;">${item.detail}</p>` : ""}
        ${renderLegDetail(item.ref)}
      </div>`;
    const next = plan[idx + 1];
    if (!next || next.section !== item.section) html += `</div>`; // close usa-accordion
  });
  container.innerHTML = html;
}

async function loadPlan() {
  const r = await fetch("api/us/today");
  const data = await r.json();
  renderState(data.account_state);

  const notesEl = document.getElementById("context-notes");
  notesEl.innerHTML = (data.context_notes || []).map(n => `
    <div class="usa-alert usa-alert--warning usa-alert--slim" style="margin-bottom:8px;">
      <div class="usa-alert__body"><p class="usa-alert__text">${n}</p></div>
    </div>`).join("");

  renderPlanHtml(data.plan || []);
}

loadPlan();
</script>
</body>
</html>
