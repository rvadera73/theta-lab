<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>theta-lab — Today</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@uswds/uswds@3.14.0/dist/css/uswds.min.css">
<style>
  /* Master-detail layout (2026-10-16 redesign, reference implementation for
     the rest of the dashboard): a persistent detail pane at the TOP shows
     the full picture for whichever item is selected below -- no per-item
     expand/collapse drill-down, no navigating to a separate page. The list
     stays compact and fully scannable; selecting a row just swaps the top
     pane's content. One detail region for assistive tech to track, instead
     of N independent disclosure widgets. Same palette/tag/card language as
     the rest of this dashboard (composite-scores.html etc.), not raw USWDS
     defaults -- see the two prior iterations of this file's history for
     why that match matters. */
  body { margin: 0; background: #f0f0f0; }
  .topbar {
    background: #2e2e38; color: #fff; padding: 12px 24px; display: flex;
    align-items: center; justify-content: space-between;
  }
  .topbar a { color: #fff; }
  .topbar .crumbs a { color: #d3d3db; text-decoration: none; font-size: 13px; margin-left: 12px; }
  main { max-width: 1000px; margin: 0 auto; padding: 24px 16px 64px; }

  .state-card { background: #fff; border-radius: 4px; padding: 14px 20px; margin-bottom: 16px; }
  .state-row { display: flex; gap: 28px; flex-wrap: wrap; align-items: center; }
  .state-row .label { font-size: 11px; color: #565c65; text-transform: uppercase; }
  .state-row .value { font-size: 17px; font-weight: 700; color: #1b1b1b; }
  .state-form { display: flex; gap: 8px; flex-wrap: wrap; align-items: flex-end; margin-top: 10px; }
  .state-form .field { display: flex; flex-direction: column; gap: 2px; }
  .state-form label { font-size: 10.5px; color: #565c65; }
  .state-form input { font-size: 12.5px; padding: 4px 7px; border: 1px solid #a9aeb1; border-radius: 3px; width: 100px; }
  .state-form button { font-size: 12.5px; padding: 5px 14px; border-radius: 3px; border: 1px solid #205493; background: #205493; color: #fff; cursor: pointer; }

  .note { background: #fff3e0; border-left: 4px solid #c3762a; padding: 7px 14px; font-size: 13px; color: #6a4700; margin-bottom: 8px; border-radius: 2px; }

  /* -- Detail pane (top, persistent) -- */
  #detail-pane {
    background: #fff; border-radius: 4px; padding: 18px 22px; margin-bottom: 18px;
    border-top: 4px solid #a9aeb1; min-height: 110px;
  }
  #detail-pane.sec-GATE { border-top-color: #b50909; }
  #detail-pane.sec-CASH_RELIEF { border-top-color: #c05600; }
  #detail-pane.sec-MANAGE { border-top-color: #565c65; }
  #detail-pane.sec-ENTRY { border-top-color: #00a91c; }
  #detail-pane .section-tag { font-size: 11px; text-transform: uppercase; font-weight: 700; letter-spacing: .04em; color: #565c65; margin-bottom: 6px; }
  #detail-pane .action { font-size: 18px; font-weight: 700; color: #1b1b1b; margin-bottom: 8px; }
  #detail-pane .why { font-size: 14px; color: #3d4551; margin-bottom: 8px; }
  #detail-pane .detail { font-size: 12.5px; color: #71767a; margin-bottom: 10px; }
  #detail-pane .placeholder { color: #a9aeb1; font-style: italic; }

  /* -- Compact list (below) -- */
  .section-head { font-size: 12px; text-transform: uppercase; font-weight: 700; letter-spacing: .04em; color: #565c65; margin: 18px 0 6px; }
  .section-head .count { color: #a9aeb1; font-weight: 400; text-transform: none; letter-spacing: 0; margin-left: 4px; }

  .list-row {
    display: flex; align-items: center; gap: 10px; background: #fff; border-radius: 3px;
    padding: 9px 14px; margin-bottom: 4px; cursor: pointer; border-left: 3px solid #a9aeb1;
    font-size: 13.5px; color: #1b1b1b; width: 100%; text-align: left; border-top: none; border-right: none; border-bottom: none;
  }
  .list-row[data-section="GATE"] { border-left-color: #b50909; }
  .list-row[data-section="CASH_RELIEF"] { border-left-color: #c05600; }
  .list-row[data-section="MANAGE"] { border-left-color: #565c65; }
  .list-row[data-section="ENTRY"] { border-left-color: #00a91c; }
  .list-row:hover { background: #f4f8fc; }
  .list-row.selected { background: #e8f0f9; font-weight: 600; }
  .list-row .worst-tag { margin-left: auto; }

  .tag { display: inline-block; padding: 1px 7px; border-radius: 999px; font-size: 10px; font-weight: 700; background: #e8f4f8; color: #205493; }
  .tag-red { background: #fde8e6; color: #b50909; }
  .tag-yellow { background: #fef0c8; color: #936316; }
  .tag-green { background: #e8f8ec; color: #00a91c; }
  .tag-gate { background: #f4e3db; color: #b50909; font-weight: 700; }

  table.leg-table { width: 100%; border-collapse: collapse; font-size: 12.5px; margin-bottom: 8px; }
  table.leg-table th { text-align: left; color: #565c65; font-weight: 600; font-size: 11px; text-transform: uppercase; padding: 4px 8px 4px 0; border-bottom: 1px solid #dfe1e2; }
  table.leg-table td { padding: 5px 8px 5px 0; vertical-align: top; }
  table.leg-table tr.reason-row td { color: #71767a; padding-top: 0; padding-bottom: 8px; font-size: 12px; }
  .ref-meta { font-size: 12.5px; color: #3d4551; }

  .empty { color: #757575; font-style: italic; padding: 24px; text-align: center; }
</style>
</head>
<body>
<div class="topbar">
  <strong>theta-lab — Today</strong>
  <span class="crumbs"><a href="/">&larr; both dashboards</a><a href="us">US</a><a href="composite-scores">Composite Scores</a><a href="watchlist">Watchlist</a></span>
</div>
<main>
  <section class="state-card">
    <div class="state-row" id="state-row">Loading…</div>
    <form class="state-form" id="state-form">
      <div class="field"><label for="f-cash">Cash</label><input id="f-cash" name="cash" type="number" step="0.01"></div>
      <div class="field"><label for="f-cpb">Cash + borrowing</label><input id="f-cpb" name="cash_plus_borrowing" type="number" step="0.01"></div>
      <div class="field"><label for="f-oreq">Option requirement</label><input id="f-oreq" name="option_requirement" type="number" step="0.01"></div>
      <div class="field"><label for="f-eq">Equity %</label><input id="f-eq" name="equity_pct" type="number" step="0.1"></div>
      <button type="submit">Update</button>
    </form>
  </section>

  <div id="context-notes"></div>

  <!-- Detail pane: always visible, updates on selection below -- this is
       the direct fix for "do not have to drill down": full information for
       the selected item lives HERE, at the top, not behind a per-row toggle. -->
  <div id="detail-pane" role="region" aria-live="polite" aria-label="Selected item detail">
    <p class="placeholder">Select an item below to see its full detail here.</p>
  </div>

  <div id="list-container"><p class="empty">Loading…</p></div>
</main>
<script>
const SECTION_KEY = {
  "GATE": "GATE", "CASH RELIEF FIRST": "CASH_RELIEF",
  "MANAGE HARD STOPS": "MANAGE", "NEW ENTRY CANDIDATES": "ENTRY",
};
const COLOR_TAG = { RED: "tag-red", YELLOW: "tag-yellow", GREEN: "tag-green", UNKNOWN: "tag" };

let plan = [];
let selectedIdx = null;

function fmtUsd(v) { return v == null ? "—" : "$" + Number(v).toLocaleString(); }

function renderState(s) {
  const row = document.getElementById("state-row");
  const form = document.getElementById("state-form");
  if (!s) {
    row.innerHTML = `<span>No account state on file yet — enter it below.</span>`;
    return;
  }
  row.innerHTML = `
    <div><div class="label">Cash</div><div class="value">${fmtUsd(s.cash)}</div></div>
    <div><div class="label">Cash + borrowing</div><div class="value">${fmtUsd(s.cash_plus_borrowing)}</div></div>
    <div><div class="label">Option requirement</div><div class="value">${fmtUsd(s.option_requirement)}</div></div>
    <div><div class="label">Equity %</div><div class="value">${s.equity_pct == null ? "—" : s.equity_pct + "%"}</div></div>
    ${s.days_stale > 0 ? `<div><span class="tag tag-red">${s.days_stale}d old</span></div>` : ""}
  `;
  form.cash.value = s.cash ?? "";
  form.cash_plus_borrowing.value = s.cash_plus_borrowing ?? "";
  form.option_requirement.value = s.option_requirement ?? "";
  form.equity_pct.value = s.equity_pct ?? "";
}

document.getElementById("state-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const fd = new FormData(e.target);
  const body = { account: "A" };
  for (const [k, v] of fd.entries()) if (v !== "") body[k] = parseFloat(v);
  await fetch("api/us/account-state", { method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body) });
  loadPlan();
});

function renderRefDetail(ref) {
  if (ref && Array.isArray(ref.legs)) {
    const rows = ref.legs.map(lg => `
      <tr>
        <td><span class="tag ${COLOR_TAG[lg.color] || 'tag'}">${lg.color || '-'}</span></td>
        <td>${lg.type || '-'} $${lg.strike ?? '-'}</td>
        <td>${lg.expiry || '-'} (${lg.dte ?? '-'}d)</td>
        <td>${lg.action || '-'}</td>
        <td>${lg.covered === true ? 'covered' : lg.covered === false ? (lg.strangle ? 'naked (strangle-paired)' : 'naked') : (lg.type === 'PUT' ? 'cash-secured' : '-')}</td>
      </tr>
      <tr class="reason-row"><td colspan="5">${lg.reason || ''}</td></tr>
    `).join("");
    return `
      <table class="leg-table">
        <thead><tr><th>Color</th><th>Leg</th><th>Expiry</th><th>Action</th><th>Coverage</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
      <div class="ref-meta">Sector: ${ref.sector || '-'} · Total cost-to-close: ${fmtUsd(ref.total_cost_to_close)} · ${ref.leg_count} leg(s) total</div>`;
  }
  if (ref) {
    return `<div class="ref-meta">
      score=${ref.score ?? '-'} (rank ${ref.rank ?? '-'}/${ref.population_size ?? '-'}) ·
      yield=${ref.yield_pct ?? '-'}% · conviction=${ref.conviction ?? '-'} ·
      iv_rank=${ref.iv_rank ?? '-'} · real put/call yield=${ref.real_put_yield_pct ?? '-'}%/${ref.real_call_yield_pct ?? '-'}% ·
      beta=${ref.beta ?? '-'} · sector=${ref.sector ?? '-'}
      ${ref.gates_fired && ref.gates_fired.length ? `<br><span class="tag tag-gate">Gates: ${ref.gates_fired.join(", ")}</span>` : ""}
    </div>`;
  }
  return "";
}

function renderDetailPane() {
  const pane = document.getElementById("detail-pane");
  if (selectedIdx === null || !plan[selectedIdx]) {
    pane.className = "";
    pane.innerHTML = `<p class="placeholder">Select an item below to see its full detail here.</p>`;
    return;
  }
  const item = plan[selectedIdx];
  pane.className = "sec-" + (SECTION_KEY[item.section] || "");
  pane.innerHTML = `
    <div class="section-tag">${item.section}</div>
    <div class="action">${item.action}</div>
    <div class="why">${item.why}</div>
    ${item.detail ? `<div class="detail">${item.detail}</div>` : ""}
    ${renderRefDetail(item.ref)}
  `;
}

function selectItem(idx) {
  selectedIdx = idx;
  renderDetailPane();
  document.querySelectorAll(".list-row").forEach(el => {
    el.classList.toggle("selected", Number(el.dataset.idx) === idx);
  });
  document.getElementById("detail-pane").scrollIntoView({ behavior: "smooth", block: "nearest" });
}

function renderList() {
  const container = document.getElementById("list-container");
  if (!plan.length) {
    container.innerHTML = `<p class="empty">Nothing actionable right now.</p>`;
    return;
  }
  const bySection = {};
  const order = [];
  plan.forEach((item, idx) => {
    if (!bySection[item.section]) { bySection[item.section] = []; order.push(item.section); }
    bySection[item.section].push({ item, idx });
  });
  let html = "";
  for (const section of order) {
    const entries = bySection[section];
    html += `<div class="section-head">${section}<span class="count">(${entries.length})</span></div>`;
    for (const { item, idx } of entries) {
      const sectionKey = SECTION_KEY[item.section] || "";
      const worstColor = item.ref && item.ref.worst_color;
      html += `
        <button type="button" class="list-row" data-idx="${idx}" data-section="${sectionKey}">
          <span>${item.action}</span>
          ${worstColor ? `<span class="tag ${COLOR_TAG[worstColor] || 'tag'} worst-tag">${worstColor}</span>` : ""}
        </button>`;
    }
  }
  container.innerHTML = html;
}

document.getElementById("list-container").addEventListener("click", (e) => {
  const row = e.target.closest(".list-row");
  if (!row) return;
  selectItem(Number(row.dataset.idx));
});

async function loadPlan() {
  const r = await fetch("api/us/today");
  const data = await r.json();
  renderState(data.account_state);

  const notesEl = document.getElementById("context-notes");
  notesEl.innerHTML = (data.context_notes || []).map(n => `<div class="note">${n}</div>`).join("");

  plan = data.plan || [];
  selectedIdx = plan.length ? 0 : null;  // default: show the top (most urgent) item's detail immediately
  renderList();
  renderDetailPane();
  if (plan.length) {
    const first = document.querySelector('.list-row[data-idx="0"]');
    if (first) first.classList.add("selected");
  }
}

loadPlan();
</script>
</body>
</html>
