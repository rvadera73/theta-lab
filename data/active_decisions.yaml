- id: march_strangle_entry_gate
  created: '2026-09-10'
  account: Account A (232)
  description: 'Hold off on new March-2027-expiry strangle entries (including adding
    to AXON''s existing March legs) until BOTH: (1) Account A margin utilization back
    under 85% (was 99%/EMERGENCY on 2026-09-10), and (2) portfolio crash-risk level
    back to YELLOW or better (was RED, 53.9% 30-day, on 2026-09-10). Resolve axon_sept18_roll_450c
    and pypl_naked_calls_cleanup first -- don''t stack a third naked-call layer while
    those two are still open.

    '
  check:
    type: metric_gate
    conditions:
    - metric: account_a_margin_utilization_pct
      operator: <
      value: 85
    - metric: macro_risk_level
      operator: in
      value:
      - GREEN
      - YELLOW
  status: BLOCKED
  resolved_date: null
  _live_values:
    account_a_margin_utilization_pct: 133.45761587251937
    macro_risk_level: RED
- id: be_puts_reduction
  created: '2026-09-10'
  account: all
  description: 'Reduce BE put exposure to zero over the next ~10 days (target: 2026-09-20)
    by closing/rolling out of all 6 open BE put legs across every account. BE is RED
    heat, RSI 77-81 (overbought/extended), and is the most widely-held name in the
    book -- also carries a naked short-call pair against it in Account A/Fidelity
    Rahul (no BE shares owned anywhere). Baseline as of 2026-09-10: Account A $170P
    (Jan 15 2027) x2 [Jan+Feb], Account B $180P (Feb 19 2027), Fidelity (Rahul) $190P
    (Jan 15 2027), Fidelity (Rajul - Rollover IRA) $200P (Jun 17 2027), Robinhood
    (Traditional) $180P (Jun 17 2027). Trader confirmed 2026-09-10 this should cover
    ALL open BE puts (not just the near-dated ones) -- an initial "Dec 2026 and before"
    framing didn''t match any real BE put, since the earliest is Jan 15 2027.

    KNOWN GAP: the automated check only sees 5 of these 6 legs -- the Robinhood (Traditional)
    $180P (Jun 17 2027) has an option-type parsing gap in that account''s transaction
    reconstruction and won''t count toward the live total below. This entry will show
    RESOLVED once the other 5 close even if that 6th one is still open -- manually
    confirm the Robinhood leg separately before treating BE exposure as fully closed.

    '
  check:
    type: leg_count_max
    ticker: BE
    option_type: P
    max_count: 0
    baseline_count: 6
  status: OPEN
  resolved_date: null
  _live_leg_count: 5
