- id: march_strangle_entry_gate
  created: '2026-09-10'
  account: Account A (232)
  description: 'Hold off on new March-2027-expiry strangle entries (including adding
    to AXON''s existing March legs) until BOTH: (1) Account A margin utilization back
    under 85% (was 99%/EMERGENCY on 2026-09-10), and (2) portfolio crash-risk level
    back to YELLOW or better (was RED, 53.9% 30-day, on 2026-09-10). Resolve axon_sept18_roll_450c
    and pypl_naked_calls_cleanup first -- don''t stack a third naked-call layer while
    those two are still open.

    '
  check:
    type: metric_gate
    conditions:
    - metric: account_a_margin_utilization_pct
      operator: <
      value: 85
    - metric: macro_risk_level
      operator: in
      value:
      - GREEN
      - YELLOW
  status: BLOCKED
  resolved_date: null
  _live_values:
    account_a_margin_utilization_pct: 135.79180499758039
    macro_risk_level: GREEN
