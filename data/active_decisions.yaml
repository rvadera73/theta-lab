- id: pypl_naked_calls_cleanup
  created: '2026-09-10'
  account: Account A (232)
  description: 'CORRECTED 2026-09-21 -- this was wrong. The account actually owns
    1,100 PYPL shares (confirmed directly against the raw schwab_rahul_individual.csv:
    cost basis $132,985.05, avg $120.90/share, current value $57,926 at ~$52.66, -56.44%
    unrealized -- a real, large embedded loss the trader is running covered calls
    against, not a fresh naked-call build). 1,100 shares covers 11 of the 12 open
    PYPL calls ($42.50C x5 Nov 20, $45C x2 Nov 20, $45C x3 Dec 18, $47.50C x2 Jan
    15) -- only ~1 contract is genuinely naked, not all 12. Root cause: `open_positions_loader_v2.py`''s
    `get_equity_summary()` returns 0 shares for PYPL/Account A despite the raw position
    file showing 1,100 directly -- same failure pattern already confirmed on FMC and
    NKE this session (2026-09-18). Do not trust this loader''s equity summary for
    naked-call coverage checks without a raw-file cross-check; a real code fix is
    still open, not yet done. Trader''s stated plan: sell additional puts near $52
    to generate premium and, if assigned, use the resulting shares to further cover/resolve
    the calls as they roll forward -- a deliberate wheel strategy against the underwater
    long position, not an oversight.

    '
  check:
    type: naked_call_count
    ticker: PYPL
    max_naked_itm: 1
  status: RESOLVED
  resolved_date: '2026-09-21'
  _live_naked_itm: 1.0
  _note: max_naked_itm raised from 0 to 1 to reflect the corrected 1,100-share coverage
    -- this is now a low-priority monitoring item, not an urgent cleanup.
