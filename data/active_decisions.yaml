decisions:
- id: account_a_800k_4week_plan
  created: '2026-09-21'
  account: Account A (232)
  description: 'RESOLVED 2026-09-21 after a full walk-through of Account A''s real
    Schwab Margin Details / Available Funds: Margin Equity $1,000,000, SMA
    (Reg-T initial-margin room) $1,600,000, Cash+Borrowing $102,000, debit balance
    $0 (zero margin interest -- no loan outstanding), no margin/maintenance
    requirement violation, no active call. Equity Percent read 29% at one point
    in the conversation (down from an earlier, WRONG 89% transcription) which
    triggered a real scare, but 29% is NOT the binding constraint here: that ratio
    governs a traditional debit-balance maintenance call, and this account carries
    zero debit balance, so that mechanism doesn''t apply. The real constraint for
    an options-heavy, no-stock-loan margin account is the options margin
    requirement itself (Opt Req $831,000 real) against SMA/equity headroom.
    Conclusion: the trader''s $800K/4-week plan is CONSERVATIVE, not aggressive,
    against real current capacity. `accounts_config.py`''s Account A capacity
    updated from $700K to $900K (a YELLOW-macro-regime working ceiling; see that
    file''s comment for the full RED/YELLOW/GREEN regime dial: $700-750K /
    $900K-$1M / $1.1-1.2M). The $800K plan sits comfortably under the new $900K
    ceiling with room to spare.

    '
  check:
    type: metric_gate
    conditions:
    - metric: account_a_margin_utilization_pct
      operator: '>'
      value: 0
  status: CLEARED
  resolved_date: '2026-09-21'
  _note: Tracking only -- not a pass/fail gate like march_strangle_entry_gate. Capacity
    is not a fixed constant -- re-derive it periodically from a fresh Schwab SMA/Equity
    read, not from this conversation's numbers indefinitely.
  _live_values:
    account_a_margin_utilization_pct: 135.7969639124189
    macro_risk_level: GREEN
