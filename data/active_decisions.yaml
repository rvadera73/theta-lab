- id: axon_sept18_roll_450c
  created: '2026-09-10'
  account: Account A (232)
  description: 'Roll the AXON $450C (Sept 18 2026 expiry) out to a January 2027 call
    (~$560-580 strike, AXON''s own missing rung in its Sept/Dec/March ladder) before
    Sept 18. Keep the $470C to settle against the 100 owned AXON shares as a clean
    covered assignment. Only 100 AXON shares exist to cover 2 ITM Sept-18 calls; rolling
    one removes the naked/short-stock risk that would otherwise be forced at expiry.

    '
  check:
    type: leg_absent
    ticker: AXON
    option_type: C
    strike: 450.0
    expiry: '2026-09-18'
  status: RESOLVED
  resolved_date: '2026-09-18'
