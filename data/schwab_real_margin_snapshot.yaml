notes: >
  RESOLVED, 2026-09-21 (corrected twice in the same session -- see history):
  Equity Percent actually reads 29%, not the 89% first recorded (a
  transcription error on my part, not a second real number). That triggered
  a real scare -- 29% is close to a typical 25-30% house/Reg-T MAINTENANCE
  floor -- but the trader confirmed directly: NO margin/maintenance
  requirement is currently showing, NO call is active, and balance subject
  to interest is $0 (no debit/margin loan at all). The traditional
  "Equity%-vs-maintenance-floor" call mechanism is built around a broker
  protecting an actual cash LOAN against securities -- with zero debit
  balance, that mechanism doesn't apply here, so the low Equity% reading is
  NOT the binding constraint for this account. The real constraint for an
  options-heavy, no-stock-loan margin account is the OPTIONS margin
  requirement itself (Opt Req, $831K real) against SMA/equity headroom, not
  a stock-margin equity ratio -- confirmed by the simple fact that Schwab
  itself shows no requirement violation despite the "low" 29% reading.
  accounts_config.py's Account A capacity updated 2026-09-21 from $700K to
  $900K (YELLOW-regime working ceiling) on this basis -- see that file's own
  comment for the full regime-dial (RED $700-750K / YELLOW $900K-$1M / GREEN
  $1.1-1.2M). Re-derive periodically from a fresh SMA/Equity read; this is
  not a fixed constant. Real gap vs this system's own model: $831K real vs
  $950,579 modeled (18% of notional) -- closer than the earlier
  $780K-vs-$934K gap, still not fully reconciled.

