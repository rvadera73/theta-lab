name: Weekly Dashboard Email

on:
  # Every Monday at 12:00 UTC = 8:00 AM ET
  schedule:
    - cron: '0 12 * * 1'

  # Also allow manual trigger from GitHub UI (Actions tab → Run workflow)
  workflow_dispatch:

jobs:
  send-dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run weekly dashboard
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          cd $GITHUB_WORKSPACE
          python3 mcp/routines/weekly_dashboard.py --no-log

      - name: Confirm success
        run: echo "Dashboard email sent to ravjdpr@gmail.com"
