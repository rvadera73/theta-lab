name: Unified Master Reports Scheduler

on:
  schedule:
    - cron: '0 11 * * *'  # Daily at 6 AM ET (11 UTC)
  workflow_dispatch:

jobs:
  generate-reports:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas yfinance scipy numpy resend pyyaml

      - name: Run Unified Reports Scheduler
        run: python3 mcp/routines/unified_reports_scheduler.py

      - name: Send Reports via Resend (if generated)
        if: always()
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: python3 scripts/send_reports_via_resend.py

      - name: Commit reports to repo
        if: always()
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Scheduler"
          git add logs/unified_master_report_*.txt 2>/dev/null || true
          git add logs/scheduler_run_*.json 2>/dev/null || true
          git commit -m "Unified master reports — $(date +%Y-%m-%d) (auto-generated by scheduler)" || true
          git push || true

      - name: Report execution summary
        if: always()
        run: |
          echo "✅ Unified Reports Scheduler Completed"
          echo "---"
          ls -lh logs/unified_master_report_$(date +%Y-%m-%d)_*.txt 2>/dev/null || echo "No reports generated today"
          echo ""
          echo "📋 Schedule:"
          echo "  • Daily: 6 AM ET"
          echo "  • Weekly: Mondays 8 AM ET"
          echo "  • Biweekly: 1st & 15th at 4 PM ET"
          echo "  • Monthly: 1st at 8 AM ET"
