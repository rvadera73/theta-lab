name: Unified Master Reports Scheduler

on:
  schedule:
    - cron: '0 11 * * *'  # Daily at 6 AM ET (11 UTC)
  workflow_dispatch:

jobs:
  generate-reports:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas yfinance scipy numpy resend pyyaml

      - name: Run Unified Reports Scheduler
        run: |
          echo "Working directory: $(pwd)"
          echo "Python version: $(python3 --version)"
          echo "Files in mcp/routines/:"
          ls -la mcp/routines/
          echo "---"
          python3 mcp/routines/unified_reports_scheduler.py

      - name: Send Reports via Resend (if generated)
        if: always()
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          echo "Checking for generated reports..."
          ls -lh logs/unified_master_report_*.txt 2>/dev/null || echo "No report files found"
          echo "RESEND_API_KEY set: $([ -z '${{ secrets.RESEND_API_KEY }}' ] && echo 'NO' || echo 'YES')"
          echo "---"
          python3 << 'EOF'
          print("Starting email script...")
          import os
          print("✓ Imported os")
          import json
          print("✓ Imported json")
          from pathlib import Path
          print("✓ Imported Path")
          from datetime import datetime, date
          print("✓ Imported datetime")
          import urllib.request
          print("✓ Imported urllib.request")
          import urllib.error
          print("✓ Imported urllib.error")

          # Find reports generated today
          today = date.today().isoformat()
          report_dir = Path('logs')

          print(f"Looking for reports in: {report_dir.absolute()}")
          print(f"Today's date: {today}")

          report_types = ['daily', 'weekly', 'biweekly', 'monthly']
          generated_reports = {}

          for report_type in report_types:
              pattern = f'unified_master_report_{today}_*{report_type}*.txt'
              matches = list(report_dir.glob(pattern))
              if matches:
                  generated_reports[report_type] = matches[0]
                  print(f"Found {report_type}: {matches[0].name}")

          if not generated_reports:
              print("⚠️  No new reports generated today")
              exit(0)

          # Send each report type via email using Resend API
          api_key = os.getenv('RESEND_API_KEY')
          if not api_key:
              print("ERROR: RESEND_API_KEY not set")
              exit(1)

          for report_type, report_file in generated_reports.items():
              report_text = report_file.read_text()

              html_body = f"""<!DOCTYPE html>
          <html><head><meta charset="utf-8"><style>
          body {{ font-family: Arial, sans-serif; max-width: 1000px; margin: 0 auto; color: #222; background: #fff; }}
          .header {{ background: #1a3a52; color: white; padding: 20px 24px; border-radius: 6px 6px 0 0; }}
          .header h1 {{ margin: 0; font-size: 24px; }}
          .header .subtitle {{ font-size: 12px; color: #aaa; margin-top: 6px; }}
          .content {{ padding: 20px 24px; font-family: 'Courier New', monospace; font-size: 11px; white-space: pre-wrap; line-height: 1.5; background: #f5f5f5; border: 1px solid #ddd; max-height: 800px; overflow-y: auto; }}
          .footer {{ padding: 12px 16px; font-size: 10px; color: #888; border-top: 1px solid #ddd; text-align: center; background: #fafafa; }}
          .report-type {{ text-transform: uppercase; letter-spacing: 1px; font-size: 13px; }}
          </style></head>
          <body>
            <div class="header">
              <h1>📊 <span class="report-type">{report_type}</span> Report</h1>
              <div class="subtitle">Theta-Lab Unified Master Reports | {datetime.now().strftime('%Y-%m-%d %H:%M UTC')}</div>
            </div>
            <div class="content">{report_text}</div>
            <div class="footer">Automated report generated by Theta-Lab scheduler | {report_file.name}</div>
          </body></html>"""

              subject_icons = {{
                  'daily': '📊',
                  'weekly': '📈',
                  'biweekly': '🔄',
                  'monthly': '📅'
              }}
              icon = subject_icons.get(report_type, '📊')

              try:
                  print(f"Processing {report_type}...")
                  subject_line = f"{icon} {report_type.upper()} — Unified Master Report ({today})"
                  print(f"Subject: {subject_line}")

                  payload = dict(
                      **{
                          'from': 'noreply@resend.dev',
                          'to': 'ravjdpr@gmail.com',
                          'subject': subject_line,
                          'html': html_body
                      }
                  )
                  print(f"✓ Payload created")

                  payload_json = json.dumps(payload)
                  print(f"✓ Payload JSON created ({len(payload_json)} bytes)")

                  auth_header = f'Bearer {api_key}'
                  headers = {
                      'Content-Type': 'application/json',
                      'Authorization': auth_header
                  }
                  print(f"✓ Headers created")

                  req = urllib.request.Request(
                      'https://api.resend.com/emails',
                      data=payload_json.encode('utf-8'),
                      headers=headers,
                      method='POST'
                  )
                  print(f"✓ Request object created")

                  with urllib.request.urlopen(req) as response:
                      result = json.loads(response.read())
                      print(f"✅ {report_type.upper()} report sent: {result.get('id', 'success')}")

              except urllib.error.HTTPError as e:
                  print(f"HTTP Error: {e.code}")
                  error_data = json.loads(e.read())
                  print(f"⚠️  {report_type.upper()} email failed: {error_data}")
              except Exception as e:
                  import traceback
                  print(f"⚠️  {report_type.upper()} email failed: {e}")
                  traceback.print_exc()

          print(f"\n✅ All generated reports ({{len(generated_reports)}} types) processed")
          EOF

      - name: Commit reports to repo
        if: always()
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Scheduler"
          git add logs/unified_master_report_*.txt 2>/dev/null || true
          git add logs/scheduler_run_*.json 2>/dev/null || true
          git commit -m "Unified master reports — $(date +%Y-%m-%d) (auto-generated by scheduler)" || true
          git push || true

      - name: Report execution summary
        if: always()
        run: |
          echo "✅ Unified Reports Scheduler Completed"
          echo "---"
          ls -lh logs/unified_master_report_$(date +%Y-%m-%d)_*.txt 2>/dev/null || echo "No reports generated today"
          echo ""
          echo "📋 Schedule:"
          echo "  • Daily: 6 AM ET"
          echo "  • Weekly: Mondays 8 AM ET"
          echo "  • Biweekly: 1st & 15th at 4 PM ET"
          echo "  • Monthly: 1st at 8 AM ET"
