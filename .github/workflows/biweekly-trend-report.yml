name: Bi-Weekly Trend Analysis Report

on:
  schedule:
    # Run on the 3rd and 18th of each month at 4 PM ET (20:00 UTC)
    - cron: '0 20 3 * *'    # 3rd of month
    - cron: '0 20 18 * *'   # 18th of month

jobs:
  biweekly-report:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml pandas numpy requests

      - name: Generate Bi-Weekly Trend Report
        run: |
          python3 << 'EOF'
          import sys
          import os
          sys.path.insert(0, '/home/rahulvadera/projects/theta-lab')

          # For local testing, adjust path
          if not os.path.exists('/home/rahulvadera/projects/theta-lab'):
              sys.path.insert(0, '.')

          from scripts.unified_master_report import UnifiedMasterReport

          report = UnifiedMasterReport()
          report.generate_unified_report()  # Auto-detects report type
          EOF

      - name: Upload report artifact
        uses: actions/upload-artifact@v3
        with:
          name: biweekly-trend-report
          path: logs/unified_master_report_*.txt

      - name: Send email via Resend
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          python3 << 'EOF'
          import requests
          import json
          import os
          import glob
          from datetime import datetime

          # Find the most recent report file
          report_files = glob.glob('logs/unified_master_report_*.txt')
          if not report_files:
              print("No report file found")
              exit(1)

          report_file = max(report_files, key=os.path.getctime)

          with open(report_file, 'r') as f:
              report_content = f.read()

          # Format as HTML email
          email_body = f"""
          <html>
            <body style="font-family: monospace; white-space: pre-wrap;">
              <h2>Bi-Weekly Trend Analysis Report</h2>
              <pre>{report_content}</pre>
              <hr>
              <p style="font-size: 0.9em; color: #666;">
                Report generated: {datetime.now().isoformat()}<br>
                Framework Status: All 8 professional frameworks operational<br>
                Next report: Monthly on {datetime.now().strftime('%B 1, %Y')}
              </p>
            </body>
          </html>
          """

          api_key = os.environ.get('RESEND_API_KEY')
          if not api_key:
              print("RESEND_API_KEY not found in secrets")
              exit(1)

          response = requests.post(
              "https://api.resend.com/emails",
              headers={
                  "Authorization": f"Bearer {api_key}",
                  "Content-Type": "application/json"
              },
              json={
                  "from": "theta-lab@resend.dev",
                  "to": "ravjdpr@gmail.com",
                  "subject": f"Bi-Weekly Trend Analysis — {datetime.now().strftime('%b %d, %Y')}",
                  "html": email_body
              }
          )

          print(f"Email sent: {response.status_code}")
          if response.status_code not in [200, 201]:
              print(f"Error: {response.text}")
          EOF
