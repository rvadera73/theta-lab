name: Daily Trade Execution Report

on:
  schedule:
    - cron: '0 11 * * *'  # 6 AM ET = 11 UTC
  workflow_dispatch:

jobs:
  daily-report:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas yfinance scipy numpy resend pyyaml

      - name: Generate Unified Master Report (Daily Stage)
        run: |
          python scripts/unified_master_report.py

      - name: Send Unified Master Report via Resend
        if: always()
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          python3 << 'EOF'
          import os
          import sys
          from pathlib import Path
          from datetime import datetime

          # Find the latest daily unified master report
          report_file = sorted(Path('logs').glob('unified_master_report_*_daily.txt'))
          if not report_file:
              print("❌ No daily unified master report found")
              sys.exit(1)

          report_file = report_file[-1]
          report_text = report_file.read_text()

          # Format as HTML
          html_body = f"""<!DOCTYPE html>
          <html><head><meta charset="utf-8"><style>
          body {{ font-family: Arial, sans-serif; max-width: 900px; margin: 0 auto; color: #222; background: #fff; }}
          .header {{ background: #2c3e50; color: white; padding: 20px 24px; border-radius: 6px 6px 0 0; }}
          .content {{ padding: 20px 24px; font-family: monospace; font-size: 11px; white-space: pre-wrap; line-height: 1.4; background: #f9f9f9; border: 1px solid #eee; }}
          .footer {{ padding: 12px 16px; font-size: 11px; color: #999; border-top: 1px solid #eee; text-align: center; }}
          </style></head>
          <body>
            <div class="header">
              <h1 style="margin:0;font-size:22px;">📊 Unified Master Report — Daily</h1>
              <div style="font-size:13px;color:#bbb;margin-top:4px;">{datetime.now().strftime('%Y-%m-%d %H:%M UTC')}</div>
            </div>
            <div class="content">{report_text[:4000]}</div>
            <div class="footer">Generated by Theta-Lab | Full report: logs/unified_master_report_*_daily.txt</div>
          </body></html>"""

          # Send via Resend
          try:
              import resend
              response = resend.Emails.send({{
                  "from": "noreply@resend.dev",
                  "to": "ravjdpr@gmail.com",
                  "subject": f"📊 Daily Unified Master Report — {datetime.now().strftime('%Y-%m-%d')}",
                  "html": html_body,
              }})
              print(f"✅ Email sent: {response.get('id', 'success')}")
          except Exception as e:
              print(f"❌ Email failed: {e}")
              sys.exit(1)
          EOF

      - name: Commit report to repo
        if: always()
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add logs/unified_master_report_*.txt 2>/dev/null || true
          git add logs/thesis_state*.json 2>/dev/null || true
          git commit -m "Daily unified master report $(date +%Y-%m-%d)" || true
          git push || true
