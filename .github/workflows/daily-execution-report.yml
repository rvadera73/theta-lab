name: Daily Trade Execution Report

on:
  schedule:
    - cron: '0 11 * * *'  # 6 AM ET = 11 UTC
  workflow_dispatch:

jobs:
  daily-report:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas yfinance scipy numpy

      - name: Generate Daily Report
        run: |
          python scripts/daily_trade_execution_report.py

      - name: Upload report artifact
        uses: actions/upload-artifact@v3
        with:
          name: daily-report
          path: logs/daily_trade_execution_*.txt

      - name: Send email via Resend
        if: always()
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          REPORT_FILE=$(ls -t logs/daily_trade_execution_*.txt | head -1)
          REPORT_CONTENT=$(cat "$REPORT_FILE")

          curl -X POST https://api.resend.com/emails \
            -H "Authorization: Bearer $RESEND_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{
              "from": "noreply@theta-lab.io",
              "to": "ravjdpr@gmail.com",
              "subject": "Daily Trade Execution — '$(date +%Y-%m-%d)'",
              "html": "<pre style=\"font-family: monospace; font-size: 12px; white-space: pre-wrap;\">'"${REPORT_CONTENT}"'</pre>"
            }'

      - name: Commit report to repo (optional)
        if: always()
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add logs/daily_trade_execution_*.txt logs/thesis_state_*.json
          git commit -m "Daily report $(date +%Y-%m-%d)" || true
          git push || true
