name: Weekly Tactical Change Alert

on:
  schedule:
    - cron: '0 8 * * 1'  # Every Monday 8 AM ET (13 UTC)
  workflow_dispatch:

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas yfinance scipy numpy resend pyyaml

      - name: Run Tactical Change Detection
        run: python3 scripts/generate_tactical_change_report.py

      - name: Check if changes were detected
        id: check_changes
        run: |
          if [ -f "logs/tactical_changes_metadata_$(date +%Y-%m-%d).json" ]; then
            SHOULD_REPORT=$(python3 -c "import json; data=json.load(open('logs/tactical_changes_metadata_$(date +%Y-%m-%d).json')); print('true' if data['should_report'] else 'false')")
            echo "should_report=$SHOULD_REPORT" >> $GITHUB_OUTPUT
          else
            echo "should_report=false" >> $GITHUB_OUTPUT
          fi

      - name: Send Tactical Alert via Resend (if changes detected)
        if: steps.check_changes.outputs.should_report == 'true'
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          python3 << 'EOF'
          import os
          import json
          from pathlib import Path
          from datetime import date

          try:
              import resend
          except ImportError:
              print("ERROR: resend library not installed")
              exit(1)

          # Load change metadata
          metadata_file = Path(f'logs/tactical_changes_metadata_{date.today().isoformat()}.json')
          if not metadata_file.exists():
              print("No change metadata found")
              exit(0)

          with open(metadata_file) as f:
              metadata = json.load(f)

          api_key = os.getenv('RESEND_API_KEY')
          if not api_key:
              print("ERROR: RESEND_API_KEY not set")
              exit(1)

          resend.api_key = api_key

          # Load report text
          report_file = Path(f'logs/tactical_change_report_{date.today().isoformat()}.txt')
          if not report_file.exists():
              print("No report file found")
              exit(0)

          report_text = report_file.read_text()

          # Create email
          severity = metadata['severity']
          changes_count = metadata['changes_count']

          subject = f"🔔 TACTICAL ALERT ({severity:.1f}/10) — {changes_count} Market Signals Detected"

          html_body = f"""
          <html>
          <head>
              <meta charset="utf-8">
              <style>
                  body {{ font-family: Arial, sans-serif; max-width: 1000px; margin: 0 auto; color: #222; }}
                  .header {{ background: #d32f2f; color: white; padding: 20px; border-radius: 6px 6px 0 0; }}
                  .header h1 {{ margin: 0; font-size: 20px; }}
                  .severity {{ font-size: 14px; margin-top: 4px; }}
                  .content {{ padding: 20px; font-family: 'Courier New', monospace; font-size: 11px; white-space: pre-wrap; line-height: 1.4; background: #f5f5f5; border: 1px solid #ddd; max-height: 800px; overflow-y: auto; }}
                  .footer {{ padding: 12px 16px; font-size: 10px; color: #888; border-top: 1px solid #ddd; text-align: center; background: #fafafa; }}
              </style>
          </head>
          <body>
              <div class="header">
                  <h1>🔔 TACTICAL CHANGE ALERT</h1>
                  <div class="severity">Severity: {severity:.1f}/10 | Changes: {changes_count}</div>
              </div>
              <div class="content">{report_text}</div>
              <div class="footer">Automated alert by Theta-Lab tactical system — Review THEMATIC_TACTICAL_GUIDE.md for action items</div>
          </body>
          </html>
          """

          response = resend.Emails.send(
              from_='onboarding@resend.dev',
              to=['ravjdpr@gmail.com'],
              subject=subject,
              html=html_body
          )

          if response.get('id'):
              print(f"✅ Tactical alert sent: {response['id']}")
          else:
              print(f"❌ Failed to send alert: {response.get('error', 'Unknown error')}")
          EOF

      - name: Commit report to repo
        if: always()
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Tactical Alert"
          git add logs/tactical_change_report_*.txt 2>/dev/null || true
          git add logs/tactical_changes_metadata_*.json 2>/dev/null || true
          git commit -m "Tactical change alert — $(date +%Y-%m-%d)" || true
          git push || true

      - name: Report execution summary
        if: always()
        run: |
          echo "✅ Tactical Change Detection Completed"
          echo "---"
          echo "📊 Execution Summary:"
          echo "  • Detection: $([ -f logs/tactical_changes_metadata_$(date +%Y-%m-%d).json ] && echo 'Complete' || echo 'Skipped')"
          echo "  • Report: $([ -f logs/tactical_change_report_$(date +%Y-%m-%d).txt ] && echo 'Generated' || echo 'Not generated')"
          echo ""
          echo "📅 Schedule: Every Monday 8 AM ET"
          echo "🎯 Threshold: Report only if severity ≥ 2.5/10 or ≥2 signals detected"
          echo ""
