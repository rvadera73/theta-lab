name: India+US Evening Trading Report

on:
  # 14:30 UTC = 8:00 PM IST (UTC+5:30), Sunday through Thursday
  schedule:
    - cron: '30 14 * * 0-4'

  # Allow manual trigger from GitHub Actions tab
  workflow_dispatch:

jobs:
  evening-report:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run evening report
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: python3 mcp/routines/india_us_evening_report.py

      - name: Confirm
        run: echo "Evening report complete — $(date -u)"
