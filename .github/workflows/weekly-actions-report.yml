name: Weekly Actions Report

on:
  schedule:
    - cron: '0 13 * * 1'  # 8 AM ET Mondays = 13 UTC
  workflow_dispatch:

jobs:
  weekly-report:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas yfinance scipy numpy resend

      - name: Generate Weekly Report
        run: |
          python -c "
from scripts.enhanced_weekly_report import generate_enhanced_weekly_report_from_df
from scripts.data_loader import DynamicDataLoader
from datetime import date

positions_df, transactions_df = DynamicDataLoader.load_all_data(
    positions_dir='data/positions',
    statements_dir='data/statements',
    use_live_positions=True,
    calculate_greeks=True
)

output_file = f'logs/enhanced_weekly_report_{date.today().isoformat()}.txt'
report = generate_enhanced_weekly_report_from_df(positions_df, transactions_df, output_file)
print(report)
          "

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: weekly-report-${{ github.run_id }}
          path: logs/enhanced_weekly_report_*.txt

      - name: Send HTML email via Resend
        if: always()
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          python3 << 'EOF'
          import os
          from pathlib import Path
          from datetime import datetime

          # Import email formatter
          import sys
          sys.path.insert(0, '/home/rahulvadera/projects/theta-lab')
          from mcp.routines.email_report import send_email

          # Load report
          report_file = sorted(Path('logs').glob('enhanced_weekly_report_*.txt'))[-1]
          report_text = report_file.read_text()

          # Format as HTML
          html_body = f"""<!DOCTYPE html>
          <html><head><meta charset="utf-8"></head>
          <body style="font-family:Arial,sans-serif;max-width:900px;margin:0 auto;color:#222;background:#fff;">
            <div style="background:#2c3e50;color:white;padding:20px 24px;border-radius:6px 6px 0 0;">
              <h1 style="margin:0;font-size:22px;">Weekly Actions Report</h1>
              <div style="font-size:13px;color:#bbb;margin-top:4px;">Week of {datetime.now().strftime('%Y-%m-%d')}</div>
            </div>
            <div style="padding:20px 24px;font-family:monospace;font-size:12px;white-space:pre-wrap;line-height:1.4;background:#f9f9f9;border:1px solid #eee;">
          {report_text}
            </div>
            <div style="padding:12px 16px;font-size:11px;color:#999;border-top:1px solid #eee;text-align:center;">
              Generated by Theta-Lab at {datetime.now().strftime('%Y-%m-%d %H:%M UTC')}
            </div>
          </body></html>"""

          # Send email
          result = send_email(
              to_email="ravjdpr@gmail.com",
              subject=f"Weekly Actions — {datetime.now().strftime('%Y-%m-%d')}",
              html_body=html_body,
              from_email="noreply@resend.dev",
              api_key=os.environ.get('RESEND_API_KEY', '')
          )

          if result.get('success'):
              print(f"✅ Email sent: {result['id']}")
          else:
              print(f"❌ Email failed: {result.get('error')}")
              sys.exit(1)
          EOF

      - name: Commit report to repo (optional)
        if: always()
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add logs/enhanced_weekly_report_*.txt logs/thesis_state_*.json
          git commit -m "Weekly report $(date +%Y-%m-%d)" || true
          git push || true
